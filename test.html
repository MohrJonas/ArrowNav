<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <button class="top-left" style="position: absolute; top: 10px; left: 10px;">TopLeft</button>
    <button class="top-right" style="position: absolute; top: 10px; left: 200px;">Right, same Y</button>
    <button class="top-right-offset" style="position: absolute; top: 40px; left: 410px;">Right, Y + 40</button>
    <button class="bottom-left-offset" style="position: absolute; top: 505px; left: 20px;">Bottom, X + 20</button>
    <button class="ignored" style="position: absolute; top: 1200px; left: 500px;">Ignored</button>
</body>
</html>
